<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glow · Moteur de style</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Décris le style de vidéo que tu veux. Le moteur Glow l'identifie et te donne un prompt prêt à coller dans Claude.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0E0E10;--surface:#151518;--ink:#F5F3EE;--muted:#A8A59D;--line:#2A2A30;--accent:#FF4D2E;--ok:#2ECC71;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Inter,system-ui,sans-serif;
 background-image:radial-gradient(1200px 500px at 80% -10%,rgba(255,77,46,.07),transparent 60%);
 padding:24px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.app{max-width:820px;margin:0 auto}
a{color:inherit}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:34px}
.bar a{text-decoration:none;font-weight:800;letter-spacing:-.03em;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.bar a.back{font:500 .8rem 'JetBrains Mono',monospace;color:var(--muted);letter-spacing:.04em}
.eyebrow{font:500 .74rem 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(2.2rem,6.5vw,3.8rem);font-weight:800;letter-spacing:-.04em;line-height:1.03;margin:12px 0 0;text-wrap:balance}
.lead{color:var(--muted);font-size:1.08rem;max-width:56ch;margin:16px 0 0}
form{display:flex;gap:10px;margin-top:28px;align-items:flex-end}
textarea{flex:1;min-height:56px;max-height:220px;resize:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:15px 18px;font:inherit}
textarea::placeholder{color:var(--muted);opacity:.85}
textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.send{border:0;background:var(--accent);color:#fff;border-radius:99px;font-weight:700;padding:0 24px;min-height:56px;cursor:pointer;white-space:nowrap}
.send:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.chip:hover{border-color:var(--muted)}
#thread{display:grid;gap:18px;margin-top:34px}
.msg{max-width:100%}
.msg.user{justify-self:end;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 4px 18px;padding:12px 16px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{color:var(--ink)}
.msg.ai p{margin:0 0 12px}
.msg.ai ul,.msg.ai ol{margin:0 0 12px;padding-left:22px}
.msg.ai li{margin:3px 0}
.code{background:#0A0A0C;border:1px solid var(--line);border-radius:14px;margin:6px 0 14px;overflow:hidden}
.code .top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font:500 .74rem 'JetBrains Mono',monospace;color:var(--muted)}
.code button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:6px 14px;font:600 .8rem Inter,sans-serif;cursor:pointer}
.code button.done{border-color:var(--ok);color:var(--ok)}
.code pre{margin:0;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;font:400 .8rem/1.6 'JetBrains Mono',monospace;max-height:520px;overflow:auto}
.err{color:#FF7A5C;border:1px solid #5a2a20;border-radius:12px;padding:10px 14px}
.typing{display:flex;gap:5px;padding:6px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:9px 16px;font:600 .88rem Inter,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.cta{margin-top:48px;border-top:1px solid var(--line);padding-top:26px;color:var(--muted);font-size:.95rem}
.cta a{color:var(--ink);font-weight:600}
.gate{display:block;margin-top:34px;max-width:460px}
.gate label{display:block;font-weight:600;margin-bottom:8px}
.gate .row{display:flex;gap:10px}
.gate input{flex:1;min-width:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:14px 18px;font:inherit}
.gate .gerr{color:#FF7A5C;min-height:1.5em;margin-top:8px;font-size:.92rem}
.note{font-size:.8rem;color:var(--muted);margin-top:12px}
@media (max-width:560px){form{flex-direction:column;align-items:stretch}.send{width:100%}textarea{min-height:84px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <a href="index.html"><svg width="30" height="20" viewBox="0 0 60 40" aria-hidden="true"><path d="M6 34 A24 24 0 0 1 54 34" fill="none" stroke="#2A2A30" stroke-width="7" stroke-linecap="round"/><path d="M6 34 A24 24 0 0 1 18 13" fill="none" stroke="#2ECC71" stroke-width="7" stroke-linecap="round"/><path d="M42 13 A24 24 0 0 1 54 34" fill="none" stroke="#FF4D2E" stroke-width="7" stroke-linecap="round"/></svg>Glow</a>
    <a class="back" href="index.html">← Retour au site</a>
  </div>

  <span class="eyebrow">Moteur de style</span>
  <h1 id="title">Réservé aux élèves Glow.</h1>
  <p class="lead" id="lead" data-text="Écris-le comme tu le dirais à un ami. Le moteur trouve le style, te demande ton script ou ton idée, puis te donne un prompt prêt à coller dans Claude." >Entre ton code d'accès pour utiliser le moteur de style.</p>

  <form class="gate" id="gate" autocomplete="off">
    <label for="code">Code d'accès</label>
    <div class="row"><input id="code" type="text" autocapitalize="characters" spellcheck="false" placeholder="GLOW-…"><button class="send" id="gsend" type="submit">Entrer</button></div>
    <div class="gerr" id="gerr" role="alert"></div>
  </form>

<div id="appbox" hidden>

  <div id="thread" aria-live="polite"></div>

  <form id="form" autocomplete="off">
    <textarea id="input" rows="1" maxlength="6000" aria-label="Ta demande" placeholder="Ex. Je souhaite une vidéo motion design comme Apple"></textarea>
    <button class="send" id="send" type="submit">Trouver le style</button>
  </form>
  <div class="chips" id="chips"></div>
  <div class="tools" id="tools" hidden>
    <button class="ghost" id="reset" type="button">Nouvelle demande</button>
  </div>
  <p class="note">Réponses générées par une IA : relis le prompt avant de l'utiliser.</p>
</div>

  <p class="cta">Envie d'un style qui est vraiment le tien, appliqué à chaque vidéo ? <a href="fiche-de-style.html">Remplis ta fiche de style</a> (gratuit).</p>
</div>

<script>
(function(){
  var API="api/chat";
  var thread=document.getElementById('thread'), form=document.getElementById('form'),
      input=document.getElementById('input'), send=document.getElementById('send'),
      chips=document.getElementById('chips'), tools=document.getElementById('tools'),
      title=document.getElementById('title'), lead=document.getElementById('lead');
  var messages=[], busy=false, code='';
  try{ code=localStorage.getItem('glow-code')||''; }catch(e){}
  var gate=document.getElementById('gate'), gerr=document.getElementById('gerr'), codeIn=document.getElementById('code'), appbox=document.getElementById('appbox');
  var START=["Une vidéo motion design comme Apple","Style néon cyberpunk","Minimaliste noir et blanc, façon Notion","Rétro années 90 avec du grain","Look magazine de mode, très éditorial"];

  function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function inline(s){return esc(s).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`\n]+)`/g,'<code>$1</code>')}
  function md(text){
    var out='', parts=text.split(/```[^\n]*\n?/);
    for(var i=0;i<parts.length;i++){
      if(i%2===1){ out+='<div class="code"><div class="top"><span>prompt</span><button type="button" data-copy>Copier</button></div><pre>'+esc(parts[i].replace(/\n$/,''))+'</pre></div>'; continue; }
      var lines=parts[i].split('\n'), html='', list=null;
      function close(){ if(list){ html+='</'+list+'>'; list=null; } }
      for(var j=0;j<lines.length;j++){
        var l=lines[j], m;
        if((m=l.match(/^\s*[-•*]\s+(.*)/))){ if(list!=='ul'){close();html+='<ul>';list='ul'} html+='<li>'+inline(m[1])+'</li>'; }
        else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=='ol'){close();html+='<ol>';list='ol'} html+='<li>'+inline(m[1])+'</li>'; }
        else if(l.trim()===''){ close(); }
        else { close(); html+='<p>'+inline(l)+'</p>'; }
      }
      close(); out+=html;
    }
    return out;
  }
  function addUser(t){ var d=document.createElement('div'); d.className='msg user'; d.textContent=t; thread.appendChild(d); }
  function addAI(t){ var d=document.createElement('div'); d.className='msg ai'; d.innerHTML=md(t); thread.appendChild(d); d.scrollIntoView({behavior:'smooth',block:'start'}); }
  function addErr(t){ var d=document.createElement('div'); d.className='msg err'; d.textContent=t; thread.appendChild(d); }
  function typing(){ var d=document.createElement('div'); d.className='msg ai'; d.id='typing'; d.innerHTML='<div class="typing" aria-label="Le moteur réfléchit"><i></i><i></i><i></i></div>'; thread.appendChild(d); return d; }

  function setChips(list){
    chips.innerHTML='';
    list.forEach(function(t){ var b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=t; b.addEventListener('click',function(){ input.value=t; submit(); }); chips.appendChild(b); });
  }
  function setBusy(b){ busy=b; send.disabled=b; input.disabled=b; }
  function after(){
    var started=messages.length>0;
    tools.hidden=!started;
    if(!started){ send.textContent='Trouver le style'; setChips(START); return; }
    send.textContent='Envoyer';
    input.placeholder='Colle ton script, décris ton idée, ou écris « pas de script »';
    var hasPrompt=/```/.test(messages[messages.length-1].content||'');
    setChips(hasPrompt?['Raccourcis à 15 secondes','Change les couleurs','Rends le rythme plus rapide']:['Pas de script, invente un exemple','J’ai une idée de sujet']);
    if(!hasPrompt) chips.lastChild.addEventListener('click',function(e){ e.stopImmediatePropagation(); input.value='Mon idée : '; input.focus(); },true);
  }
  function submit(){
    var t=input.value.trim();
    if(!t||busy) return;
    if(!messages.length){ title.textContent='Ton style, ton prompt.'; lead.hidden=true; }
    messages.push({role:'user',content:t}); addUser(t); input.value=''; autosize();
    setBusy(true); chips.innerHTML='';
    var tp=typing();
    fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages,code:code})})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,status:r.status,j:j}; }); })
    .then(function(o){
      tp.remove();
      if(o.status===401){ messages.pop(); lock('Ton code n\u2019est plus valide. Entre-le à nouveau.'); }
      else if(!o.ok||!o.j.text){ messages.pop(); addErr((o.j&&o.j.error)||'Le moteur est indisponible pour le moment.'); }
      else { messages.push({role:'assistant',content:o.j.text}); addAI(o.j.text); }
    })
    .catch(function(){ tp.remove(); messages.pop(); addErr('Impossible de joindre le moteur. Vérifie ta connexion et réessaie.'); })
    .then(function(){ setBusy(false); after(); input.focus(); });
  }
  function autosize(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,220)+'px'; }

  form.addEventListener('submit',function(e){ e.preventDefault(); submit(); });
  input.addEventListener('input',autosize);
  input.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); submit(); } });
  thread.addEventListener('click',function(e){
    var b=e.target.closest('[data-copy]'); if(!b) return;
    var txt=b.closest('.code').querySelector('pre').innerText;
    function ok(){ b.textContent='Copié'; b.classList.add('done'); setTimeout(function(){ b.textContent='Copier'; b.classList.remove('done'); },1800); }
    function fb(){ var r=document.createRange(); r.selectNodeContents(b.closest('.code').querySelector('pre')); var s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent='Sélectionné : Ctrl+C'; }
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok,fb); else fb();
  });
  document.getElementById('reset').addEventListener('click',function(){
    messages=[]; thread.innerHTML=''; title.textContent='Décris le style que tu veux.'; lead.hidden=false;
    input.placeholder='Ex. Je souhaite une vidéo motion design comme Apple'; after(); input.focus();
  });
  function unlock(){ gate.hidden=true; appbox.hidden=false; title.textContent=messages.length?'Ton style, ton prompt.':'Décris le style que tu veux.'; lead.textContent=lead.getAttribute('data-text'); lead.hidden=false; after(); input.focus(); }
  function lock(msg){ try{ localStorage.removeItem('glow-code'); }catch(e){} code=''; appbox.hidden=true; gate.hidden=false; title.textContent='Réservé aux élèves Glow.'; lead.textContent='Entre ton code d\u2019accès pour utiliser le moteur de style.'; lead.hidden=false; gerr.textContent=msg||''; }
  function check(c,quiet){
    return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({check:true,code:c})})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,status:r.status,j:j}; }); })
    .then(function(o){
      if(o.ok){ code=c; try{ localStorage.setItem('glow-code',c); }catch(e){} unlock(); }
      else if(o.status===401){ if(!quiet) gerr.textContent='Code invalide. Vérifie-le ou demande-le à Louis.'; lock(quiet?'':gerr.textContent); }
      else { gerr.textContent=(o.j&&o.j.error)||'Le moteur est indisponible pour le moment.'; }
    }).catch(function(){ gerr.textContent='Impossible de joindre le moteur. Réessaie.'; });
  }
  gate.addEventListener('submit',function(e){ e.preventDefault(); var c=codeIn.value.trim(); if(!c) return; gerr.textContent=''; check(c,false); });
  appbox.hidden=true; gate.hidden=false;
  if(code){ check(code,true); }
})();
</script>
</body>
</html>
