<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glow · Ma fiche de style</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@400;600;800;900&family=Archivo+Black&family=Anton&family=Bebas+Neue&family=Syne:wght@700;800&family=Unbounded:wght@700&family=Bricolage+Grotesque:wght@700;800&family=Outfit:wght@600;800&family=Sora:wght@700;800&family=Fredoka:wght@600;700&family=Baloo+2:wght@700;800&family=Montserrat:wght@700;800&family=Space+Grotesk:wght@500;700&family=DM+Serif+Display&family=Fraunces:wght@700;900&family=Inter:wght@400;600&family=DM+Sans:wght@400;600&family=Manrope:wght@400;700&family=Instrument+Sans:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Charte graphique Glow : fond blanc, anthracite, orange, pilules et grands rayons, une seule police ronde (Poppins). */
:root{
  --bg:#FFFFFF; --ink:#1A1A1A; --muted:#6B6B6B; --line:#EFEFEF; --accent:#FF6B1A; --soft:#FFE3D1; --grey:#EFEFEF;
  --warn:#C2410C; --ok:#1B8A4A;
  --font:'Poppins',system-ui,sans-serif; --mono:'Poppins',system-ui,sans-serif;
  --shadow:0 14px 34px rgba(26,26,26,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font);margin:0;padding-block:24px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--font);font-weight:700;text-wrap:balance;margin:0;line-height:1.08;letter-spacing:-.03em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
em{font-style:normal;color:var(--accent)}

.glowbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.3rem;letter-spacing:-.03em}
.dot{position:relative;width:14px;height:14px;border-radius:50%;background:var(--accent);flex:none}
.dot::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:var(--soft);z-index:-1;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.7}50%{transform:scale(1.1);opacity:1}}
.top{font-weight:500;font-size:.85rem;color:var(--muted)}

.prog{position:relative;height:14px;border-radius:99px;background:var(--grey);margin:8px 7px 0}
.prog-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent);transition:width .45s cubic-bezier(.34,1.56,.64,1)}
.prog .dot{position:absolute;top:-1px;width:16px;height:16px;margin-left:-8px;transition:left .45s cubic-bezier(.34,1.56,.64,1)}
.prog .dot::after{inset:-11px}
.steps{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.steps button{flex:none;border:0;border-radius:99px;background:var(--grey);color:#8a8a8a;padding:8px 16px;font-weight:600;font-size:.84rem;cursor:pointer;white-space:nowrap}
.steps button.done{background:var(--soft);color:var(--ink)}
.steps button.cur{background:var(--accent);color:#fff}
.steps button:disabled{cursor:default;opacity:.8}
.tl-meta{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-weight:500;font-size:.85rem;color:var(--muted)}

.layout{display:grid;gap:28px;margin-top:26px}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,1fr) 290px;gap:48px}}
#aside{order:-1;min-width:0}
@media (min-width:900px){#aside{order:0;position:sticky;top:24px;align-self:start}}
main{min-width:0}

.step-title{font-size:clamp(2rem,5vw,3rem);font-weight:800}
.step-intro{color:var(--muted);margin-top:12px;max-width:58ch}
.q{margin-top:16px;padding:22px 24px;border-radius:32px;background:#fff;border:2px solid var(--line)}
.q:first-of-type{margin-top:26px}
.q.ok{border-color:var(--soft)}
.q-head{display:flex;gap:12px;align-items:flex-start}
.q-n{font-weight:700;font-size:.74rem;color:var(--accent);background:var(--soft);padding:3px 10px;border-radius:99px;margin-top:3px;flex:none}
.q-label{font-weight:600;font-size:1.05rem;display:block;line-height:1.35}
.req{color:var(--accent)}
.opt-tag{font-weight:500;font-size:.78rem;color:var(--muted);margin-left:6px}
.hint{color:var(--muted);font-size:.9rem;margin-top:3px}
.q-body{margin-top:14px}
.err{color:var(--warn);font-size:.9rem;min-height:1.2em;margin-top:6px;font-weight:500}

input[type=text],textarea,select{width:100%;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:22px;padding:12px 18px;font:inherit}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:92px;border-radius:26px}
::placeholder{color:#9a9a9a}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 18px;font-weight:600;font-size:.94rem;cursor:pointer;min-height:42px}
.chip[aria-pressed=true],.chip[aria-checked=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.count{font-weight:500;font-size:.8rem;color:var(--muted);margin-top:8px}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:24px;padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt b{font-weight:600;font-size:.95rem}
.opt span{color:var(--muted);font-size:.84rem;line-height:1.4}
.opt[aria-checked=true]{border-color:var(--accent);background:var(--soft)}

.scale{display:grid;gap:6px}
.scale input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.scale-ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);gap:12px}
.scale-now{font-weight:700;font-size:.9rem;color:var(--ink)}
.scale-now.off{color:var(--muted);font-weight:500}

.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.preset{border:2px solid var(--line);background:#fff;border-radius:24px;padding:9px;cursor:pointer;text-align:left;display:grid;gap:6px;min-width:0}
.preset i{display:grid;grid-template-columns:repeat(5,1fr);height:28px;border-radius:14px;overflow:hidden}
.preset i s{display:block}
.preset span{font-size:.82rem;font-weight:600;padding-left:4px}
.preset[aria-checked=true]{border-color:var(--accent);background:var(--soft)}
.pickers{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:14px;margin-top:18px}
.picker{display:grid;gap:4px;min-width:0}
.picker label{font-weight:600;font-size:.9rem}
.picker input[type=color]{width:100%;height:48px;border:2px solid var(--line);border-radius:99px;padding:4px;background:#fff;cursor:pointer}
.picker code{font:600 .8rem var(--font);color:var(--muted)}
.picker small{color:var(--muted);font-size:.78rem;line-height:1.35}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.badge{font-weight:600;font-size:.76rem;padding:4px 12px;border-radius:99px;background:var(--grey)}
.badge.ok{color:var(--ok);background:#E5F4E4}
.badge.low{color:var(--warn);background:var(--soft)}

.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.fontcard{border:2px solid var(--line);background:#fff;border-radius:24px;padding:14px;cursor:pointer;text-align:left;display:grid;gap:4px;min-width:0}
.fontcard .sample{font-size:1.5rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.fontcard code{font:600 .72rem var(--font);color:var(--muted)}
.fontcard small{color:var(--muted);font-size:.8rem}
.fontcard[aria-checked=true]{border-color:var(--accent);background:var(--soft)}
.tech{display:grid;gap:16px}
.tech .sub{font-weight:600;font-size:.9rem;display:block;margin-bottom:6px}

.nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;flex-wrap:wrap}
.btn{border:2px solid var(--accent);background:var(--accent);color:#fff;border-radius:99px;padding:12px 28px;font-weight:700;cursor:pointer;min-height:48px}
.btn.ghost{background:var(--grey);color:var(--ink);border-color:var(--grey)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.intro h1{font-size:clamp(2.8rem,9vw,5.2rem);font-weight:800;max-width:11ch;letter-spacing:-.04em}
.intro .lead{font-size:1.15rem;color:#444;max-width:54ch;margin-top:18px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.cats span{background:var(--soft);border-radius:99px;padding:6px 16px;font-weight:600;font-size:.88rem}
.gets{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:26px}
.get{background:var(--grey);border-radius:32px;padding:20px 22px;box-shadow:var(--shadow)}
.get.on{background:var(--soft)}
.get b{display:block;font-size:1.1rem;margin-bottom:4px}
.get span{color:#444;font-size:.92rem}
.intro .nav{justify-content:flex-start}

.result-grid{display:grid;gap:22px;margin-top:24px}
.card{background:#fff;border:2px solid var(--line);border-radius:36px;padding:24px 26px;box-shadow:var(--shadow)}
.cat-list{display:grid;gap:8px}
.cat-row{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--grey);border-radius:99px;padding:8px 8px 8px 20px;font-weight:600;font-size:.95rem}
.cat-row.full{background:var(--soft)}
.cat-row button{border:0;background:#fff;border-radius:99px;padding:6px 16px;font-weight:600;font-size:.85rem;cursor:pointer}
.cat-row small{font-weight:500;color:var(--muted);font-size:.8rem;margin-left:8px}
.dl{display:grid;gap:10px;margin:0}
.dl div{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;font-size:.95rem}
.dl dt{font-weight:700;font-size:.78rem;color:var(--muted);padding-top:3px}
.dl dd{margin:0;overflow-wrap:anywhere}
.sw{display:flex;gap:6px;flex-wrap:nowrap}
.sw i{display:block;width:44px;height:30px;border-radius:99px;border:2px solid var(--line);flex:none}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.after{margin:14px 0 0;padding-left:20px}
.after li{margin-top:6px}
.note{color:var(--muted);font-size:.88rem;margin-top:10px}
#fallback{display:none;margin-top:12px}
#fallback.show{display:block}
#fallback textarea{font:400 .8rem ui-monospace,monospace;min-height:140px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-size:.92rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px);z-index:20}
#toast.show{opacity:1}

/* Aperçu vertical (reflète le style choisi par l'élève) */
#pvwrap{border:2px solid var(--line);border-radius:36px;background:#fff;padding:14px;box-shadow:var(--shadow)}
#pvwrap summary{font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted)}
@media (min-width:900px){#pvwrap summary{display:none}}
.pv-body{margin-top:12px}
@media (min-width:900px){.pv-body{margin-top:0}}
.pv{--pv-r:5cqw;position:relative;width:100%;max-width:240px;margin:0 auto;aspect-ratio:9/16;container-type:inline-size;border-radius:28px;overflow:hidden;border:2px solid var(--line);background:#000}
.pv-inner{position:absolute;inset:0;padding:9cqw;display:flex;flex-direction:column;justify-content:center;gap:5cqw;background:var(--pv-bg);color:var(--pv-fg);font-family:var(--pv-fb)}
.pv.left .pv-inner{align-items:flex-start;text-align:left}
.pv.center .pv-inner{align-items:center;text-align:center}
.pv.grad .pv-inner{background:linear-gradient(160deg,var(--pv-bg),color-mix(in srgb,var(--pv-bg) 70%,var(--pv-a)))}
.pv.grain .pv-inner::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
.pv-top{font-size:3.8cqw;letter-spacing:.12em;text-transform:uppercase;opacity:.8;position:relative}
.pv-kw{display:flex;align-items:baseline;gap:3cqw;flex-wrap:wrap;position:relative}
.pv-w,.pv-num{display:inline-block;font-family:var(--pv-ft);font-weight:var(--pv-fw,700);font-size:16cqw;line-height:1;text-transform:var(--pv-case,uppercase)}
.pv-num{color:var(--pv-a)}
.pv.outline .pv-w{color:transparent;-webkit-text-stroke:.5cqw var(--pv-fg)}
.pv.soft3d .pv-w{text-shadow:1cqw 1cqw 0 var(--pv-a)}
.pv-txt{font-size:5.2cqw;line-height:1.35;max-width:26ch;opacity:.9;position:relative}
.pv-pill{display:inline-block;background:var(--pv-cl);color:var(--pv-fg);font-size:4.6cqw;font-weight:700;padding:2cqw 4.5cqw;border-radius:var(--pv-r);position:relative;box-shadow:var(--pv-sh,none)}
.pv-bar{position:relative;width:60%;height:3cqw;border-radius:99cqw;background:var(--pv-n)}
.pv-bar b{position:absolute;left:0;top:0;bottom:0;width:62%;border-radius:99cqw;background:var(--pv-a)}
.pv.collage .pv-pill{transform:rotate(-4deg)}
.pv.collage .pv-w{transform:rotate(-2deg)}
.pv-deco{position:absolute;inset:0;pointer-events:none}
.pv-deco b{position:absolute;display:block;border-radius:var(--pv-dr,50%)}
.pv.geo .pv-deco b{border-radius:0;transform:rotate(45deg)}
.pv-safe,.pv-safe-r{display:none;position:absolute;background:repeating-linear-gradient(135deg,rgba(255,40,80,.35) 0 6px,rgba(255,40,80,.12) 6px 12px);border:1px dashed rgba(255,40,80,.9)}
.pv-safe{left:0;right:0;bottom:0;height:13%}
.pv-safe-r{top:0;bottom:0;right:0;width:11%}
.pv.showsafe .pv-safe,.pv.showsafe .pv-safe-r{display:block}
.pv-ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:.84rem;font-weight:500}
.pv-ctrl label{display:flex;gap:6px;align-items:center;cursor:pointer}
.pv-ctrl button{border:0;background:var(--grey);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:.84rem;font-weight:600}
.pv-meta{font-weight:500;font-size:.74rem;color:var(--muted);margin-top:10px;text-align:center;overflow-wrap:anywhere}

@media (max-width:520px){.dl div{grid-template-columns:1fr;gap:2px}.q{padding:18px}}
@media (prefers-reduced-motion:reduce){*,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="app" id="top">
  <div class="glowbar"><div class="brand"><span class="dot" aria-hidden="true"></span>Glow</div><span class="top" id="timecost">Fiche de style · v2.0</span></div>
  <div id="tlwrap" hidden>
    <div class="prog" aria-hidden="true"><div class="prog-fill" id="prog-fill"></div><span class="dot" id="prog-dot"></span></div>
    <div class="steps" id="tl" role="group" aria-label="Catégories"></div>
    <div class="tl-meta"><span id="tl-step"></span><span id="tl-q"></span></div>
  </div>
  <div class="layout">
    <main id="main" aria-live="polite"></main>
    <aside id="aside" hidden>
      <details id="pvwrap">
        <summary>Aperçu en direct</summary>
        <div class="pv-body">
          <div class="pv center" id="pv">
            <div class="pv-inner">
              <div class="pv-deco" id="pv-deco"></div>
              <div class="pv-top">Exemple · <span id="pv-name">ton compte</span></div>
              <div class="pv-kw"><span class="pv-w">Mot-clé</span><span class="pv-num">×3</span></div>
              <p class="pv-txt">Une phrase courte. Jamais de sous-titres complets.</p>
              <span class="pv-pill">Résultat</span>
              <div class="pv-bar"><b></b></div>
            </div>
            <div class="pv-safe"></div><div class="pv-safe-r"></div>
          </div>
          <div class="pv-ctrl">
            <label><input type="checkbox" id="pv-safe"> Zones de sécurité</label>
            <button type="button" id="pv-replay">Rejouer</button>
          </div>
          <p class="pv-meta" id="pv-meta"></p>
        </div>
      </details>
    </aside>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="lib/jspdf.umd.min.js"></script>
<script>
(function(){

var FONTS_B=[

/* ---------- Couleurs ---------- */
function rgb(h){var n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255]}
function lum(h){var c=rgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function ratio(a,b){var A=lum(a),B=lum(b);var hi=Math.max(A,B),lo=Math.min(A,B);return (hi+.05)/(lo+.05)}
function sat(h){var c=rgb(h).map(function(v){return v/255}),mx=Math.max.apply(null,c),mn=Math.min.apply(null,c);if(mx===mn)return 0;var l=(mx+mn)/2;return (mx-mn)/(1-Math.abs(2*l-1))}
function inkFor(h){return lum(h)>.4?'#111111':'#FFFFFF'}
function ambiance(h){var l=lum(h);if(sat(h)>.55&&l>.04&&l<.6)return 'Coloré';if(l<.12)return 'Sombre';if(l>.55)return 'Clair';return 'Intermédiaire'}

/* ---------- Valeurs de réponse ---------- */
function opt(q,v){for(var i=0;i<q.opts.length;i++)if(q.opts[i].v===v)return q.opts[i];return null}
function answerOf(q){ /* texte lisible, ou null si non répondu */
  var v=S[q.id];
  switch(q.type){
    case 'text':case 'textarea':v=String(v||'').trim();return v||null;
    case 'multi':return (v&&v.length)?v.join(', '):null;
    case 'single':{var o=opt(q,v);if(!o)return null;return o.t+(o.r?'. '+o.r:'')}
    case 'scale':return v?v+'/5 ('+q.labels[v-1]+')':null;
    case 'font':return v?v+' (Google Fonts)':null;
    case 'palette':return paletteTouched?PAL_ROLES.map(function(r){return r[1]+' '+S.palette[r[0]].toUpperCase()}).join(', '):null;
    case 'tech':return S.cadence?S.logiciel+', timeline à '+S.cadence+' images/s':null;
  }
  return null;
}
function plain(q){ /* valeur courte pour le JSON */
  var v=S[q.id];
  switch(q.type){
    case 'text':case 'textarea':v=String(v||'').trim();return v||null;
    case 'multi':return (v&&v.length)?v.slice():null;
    case 'single':{var o=opt(q,v);return o?o.t:null}
    case 'scale':return v?{niveau:v,libelle:q.labels[v-1]}:null;
    case 'font':return v||null;
    case 'palette':return paletteTouched?clone(S.palette):null;
    case 'tech':return S.cadence?{logiciel:S.logiciel,cadence:S.cadence}:null;
  }
  return null;
}
function counts(){
  var tot=0,ans=0,per={};
  STEPS.forEach(function(st){var a=0;st.qs.forEach(function(q){if(answerOf(q)!==null)a++});per[st.k]={a:a,t:st.qs.length};tot+=st.qs.length;ans+=a});
  return {tot:tot,ans:ans,per:per};
}

function sync(){
  $$('[data-k]').forEach(function(el){var v=S[el.dataset.k];if(el.value!==String(v==null?'':v))el.value=v==null?'':v});
  $$('[data-multi]').forEach(function(b){b.setAttribute('aria-pressed',(S[b.dataset.multi]||[]).indexOf(b.dataset.v)>-1?'true':'false')});
  $$('[data-count]').forEach(function(p){var id=p.dataset.count,q=QMAP[id];p.textContent=(S[id]||[]).length+' / '+q.max+' choisis'});
  $$('[data-single]').forEach(function(b){b.setAttribute('aria-checked',S[b.dataset.single]===b.dataset.v?'true':'false')});
  $$('[data-font]').forEach(function(b){b.setAttribute('aria-checked',S[b.dataset.font]===b.dataset.v?'true':'false')});
  $$('[data-cad]').forEach(function(b){b.setAttribute('aria-checked',String(S.cadence)===b.dataset.cad?'true':'false')});
  $$('[data-scale]').forEach(function(r){var id=r.dataset.scale,q=QMAP[id],v=S[id];r.value=v||3;var now=$('[data-now="'+id+'"]');if(now){now.textContent=v?q.labels[v-1]:'Non précisé';now.classList.toggle('off',!v)}});
  $$('[data-preset]').forEach(function(b){b.setAttribute('aria-checked',S.palette.preset===b.dataset.preset?'true':'false')});
  $$('[data-pal]').forEach(function(inp){var k=inp.dataset.pal;if(inp.value!==S.palette[k])inp.value=S.palette[k];var c=$('[data-hex="'+k+'"]');if(c)c.textContent=S.palette[k].toUpperCase()});
  $$('.q[data-q]').forEach(function(el){var q=QMAP[el.dataset.q];el.classList.toggle('ok',!!q&&answerOf(q)!==null)});
  var bd=$('#badges');
  if(bd){
    var p=S.palette,rt=ratio(p.texte,p.fond),ra=ratio(p.accent,p.fond);
    var bg=function(label,r,min){var ok=r>=min;return '<span class="badge '+(ok?'ok':'low')+'">'+label+' '+r.toFixed(1)+':1 · '+(ok?'lisible':'trop faible')+'</span>'};
    bd.innerHTML=bg('Texte / fond',rt,4.5)+bg('Accent / fond',ra,3)+'<span class="badge">Fond '+ambiance(p.fond).toLowerCase()+'</span>';
  }

  return JSON.stringify({schema:'fiche-style',version:VERSION,created:date.toISOString(),reviewBefore:nextReview(date).toISOString().slice(0,10),
    questions:c.tot,answered:c.ans,answers:cat,labels:labels,
    derived:{ambiance:ambiance(p.fond),contraste:{texteFond:+ratio(p.texte,p.fond).toFixed(1),accentFond:+ratio(p.accent,p.fond).toFixed(1)}},
    v1:legacy},null,2);
}

/* ---------- PDF ---------- */
function pdfSafe(t){
  return String(t==null?'':t).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/…/g,'...').replace(/→/g,'->').replace(/–/g,'-').replace(/œ/g,'oe').replace(/Œ/g,'OE').replace(/[  ]/g,' ').replace(/•/g,'-').replace(/×/g,'x')
    .replace(/[^\n -~¡-ÿ€—]/g,'');
}
function buildPdf(date){
  var jsPDF=window.jspdf.jsPDF, doc=new jsPDF({unit:'mm',format:'a4'});
  var p=S.palette,W=210,M=16,CW=W-2*M,y=0,txt=pdfSafe;
  function fill(h){var c=rgb(h);doc.setFillColor(c[0],c[1],c[2])}
  function color(h){var c=rgb(h);doc.setTextColor(c[0],c[1],c[2])}
  function ink(a){doc.setTextColor(a[0],a[1],a[2])}
  function need(h){if(y+h>282){doc.addPage();y=18}}
  doc.setFont('helvetica','bold');doc.setFontSize(26);
  var nameLines=doc.splitTextToSize(txt(S.compte||'Sans nom').toUpperCase(),CW).slice(0,2);
  var bandH=38+nameLines.length*11;
  fill(p.fond);doc.rect(0,0,W,bandH,'F');
  color(p.accent);doc.setFontSize(9);doc.text('FICHE DE STYLE  ·  VERSION '+VERSION,M,16);
  color(p.texte);doc.setFontSize(26);doc.text(nameLines,M,28);
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);
  doc.text(txt('Créée le '+fr(date)+'  ·  à refaire avant le '+fr(nextReview(date))),M,bandH-8);
  y=bandH+10;
  var steps=['Renvoie le PDF et le fichier .json dans la conversation Instagram où tu as reçu le lien de cette fiche.','Je lis ta fiche et je te réponds personnellement avec la suite. Si Glow te convient, ton skill sur mesure est préparé à partir de cette fiche.','En attendant, colle la version texte (dernières pages) au début d’une conversation avec Claude pour tester ton style.'];
  doc.setFontSize(9.5);
  var wrapped=steps.map(function(t){return doc.splitTextToSize(txt(t),CW-16)});
  var bh=14+wrapped.reduce(function(a,w){return a+w.length*4.6+2},0);
  fill('#FFE3D1');doc.roundedRect(M,y,CW,bh,5,5,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(8.5);ink([26,26,26]);doc.text('COMMENT L\'UTILISER',M+6,y+7);
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);ink([26,26,26]);
  var yy=y+13;
  wrapped.forEach(function(w,i){doc.text((i+1)+'.',M+6,yy);doc.text(w,M+12,yy);yy+=w.length*4.6+2});
  y+=bh+10;
  function section(i,t){need(18);doc.setFont('helvetica','bold');doc.setFontSize(9);color('#FF6B1A');doc.text(txt((i+1)+'  '+t).toUpperCase(),M,y);doc.setDrawColor(239,239,239);doc.setLineWidth(.6);doc.line(M,y+2.5,M+CW,y+2.5);y+=9}
  function row(label,value){
    var lines=doc.splitTextToSize(txt(value),CW-52);
    need(lines.length*4.8+3);
    doc.setFont('helvetica','bold');doc.setFontSize(8.6);ink([107,107,107]);
    doc.text(doc.splitTextToSize(txt(label),46),M,y);
    doc.setFont('helvetica','normal');doc.setFontSize(9.6);ink([26,26,26]);doc.text(lines,M+50,y);
    y+=Math.max(lines.length,1)*4.8+2.4;
  }
  STEPS.forEach(function(st,i){
    section(i,st.title);
    st.qs.forEach(function(q){
      if(q.type==='palette'){
        need(34);var bw=(CW-12)/5;
        PAL_ROLES.forEach(function(r,j){
          var x=M+j*(bw+3),hx=p[r[0]];fill(hx);doc.setDrawColor(211,216,224);doc.setLineWidth(.2);doc.roundedRect(x,y,bw,18,5,5,'FD');
          color(inkFor(hx));doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.text(hx.toUpperCase(),x+bw/2,y+10.5,{align:'center'});
          ink([26,26,26]);doc.setFont('helvetica','normal');doc.setFontSize(7.6);doc.text(txt(r[1]),x,y+23);
        });
        y+=29;
        row('Contraste','Texte / fond '+ratio(p.texte,p.fond).toFixed(1)+':1, accent / fond '+ratio(p.accent,p.fond).toFixed(1)+':1');
        return;
      }
      var a=answerOf(q);
      row(q.s,a===null?'Non précisé (à proposer)':a);
    });
    y+=5;
  });
  doc.addPage();y=18;
  doc.setFont('helvetica','bold');doc.setFontSize(13);ink([26,26,26]);doc.text('Version texte à coller dans Claude',M,y);y+=8;
  doc.setFont('courier','normal');doc.setFontSize(8.2);
  buildText(date).split('\n').forEach(function(line){
    var ls=line===''?['']:doc.splitTextToSize(txt(line),CW);
    ls.forEach(function(l){need(4.2);doc.text(l,M,y);y+=3.9});
  });
  var pages=doc.getNumberOfPages();
  for(var i=1;i<=pages;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);ink([120,120,120]);
    doc.text(txt('Fiche de style · '+(S.compte||'')+' · v'+VERSION),M,290);doc.text(i+' / '+pages,W-M,290,{align:'right'});}
  return doc.output('arraybuffer');
}

/* ---------- Résultat ---------- */
var dl=null;
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('show')},2800)}
function renderResult(){
  $('#tlwrap').hidden=false;$('#aside').hidden=false;
  drawProgress(NSTEPS,true);
  var c=counts(),p=S.palette;
  $('#tl-step').textContent='Fiche terminée';$('#tl-q').textContent=c.ans+' réponses sur '+c.tot;
  var pdfOk=!!(window.jspdf&&window.jspdf.jsPDF);
  var rows=STEPS.map(function(st,j){var k=c.per[st.k];return '<div class="cat-row'+(k.a===k.t?' full':'')+'"><span>'+(j+1)+' · '+esc(st.title)+'<small>'+k.a+' / '+k.t+'</small></span><button type="button" data-goto="'+j+'">'+(k.a===k.t?'Relire':'Compléter')+'</button></div>'}).join('');
  $('#main').innerHTML='<section><h2 class="step-title">Ta fiche est <em>prête</em>.</h2><p class="step-intro">'+c.ans+' réponses sur '+c.tot+'. Plus la fiche est complète, plus ton skill sera précis. Tu peux compléter n’importe quelle catégorie avant de télécharger.</p>'+
   '<div class="result-grid"><div class="card"><div class="cat-list">'+rows+'</div></div><div class="card"><dl class="dl">'+
   '<div><dt>Compte</dt><dd>'+esc(S.compte)+'</dd></div>'+
   '<div><dt>Thématique</dt><dd>'+esc(S.niche)+'</dd></div>'+
   '<div><dt>Palette</dt><dd><div class="sw">'+PAL_ROLES.map(function(r){return '<i style="background:'+p[r[0]]+'" title="'+r[1]+' '+p[r[0]]+'"></i>'}).join('')+'</div></dd></div>'+
   '<div><dt>Polices</dt><dd><span style="font-family:\''+esc(S.policeTitre)+'\',sans-serif;font-size:1.25rem;font-weight:700">'+esc(S.policeTitre)+'</span> + <span style="font-family:\''+esc(S.policeTexte)+'\',sans-serif">'+esc(S.policeTexte)+'</span></dd></div>'+
   '</dl></div>'+
   '<div class="card"><h3 style="font-size:1.35rem">Télécharge tes fichiers</h3><div class="actions" style="margin-top:14px"><button class="btn" id="dl-pdf" type="button"'+(pdfOk?'':' disabled')+'>Fiche PDF</button><button class="btn ghost" id="dl-json" type="button">Fichier équipe (.json)</button><button class="btn ghost" id="cp-txt" type="button">Copier la version texte</button></div>'+
   '<p class="note" id="dl-note"></p><div id="fallback"><textarea id="fallback-ta" readonly aria-label="Texte à copier"></textarea></div>'+
   '<h3 style="font-size:1.1rem;margin-top:22px">Et maintenant</h3><ol class="after"><li>Renvoie le PDF et le fichier .json dans la conversation Instagram où tu as reçu le lien de cette fiche.</li><li>Je lis ta fiche et je te réponds personnellement avec la suite. Si Glow te convient, ton skill sur mesure est préparé à partir de cette fiche.</li><li>En attendant, copie la version texte et colle-la au début d’une conversation avec Claude pour tester ton style.</li></ol></div></div>'+
   '<div class="nav"><button class="btn ghost" id="back" type="button">Modifier mes réponses</button></div></section>';
  $('#back').onclick=function(){go(NSTEPS-1,true)};
  $$('[data-goto]').forEach(function(b){b.onclick=function(){go(+b.dataset.goto,true)}});
  $('#dl-pdf').onclick=function(){saveFile('fiche-style-'+slug(S.compte)+'.pdf','application/pdf',function(date){return buildPdf(date)})};
  $('#dl-json').onclick=function(){saveFile('fiche-style-'+slug(S.compte)+'.json','application/json',function(date){return buildJson(date)})};
  $('#cp-txt').onclick=copyText;
  $('#dl-note').textContent=dl?'Chaque fichier te demande une confirmation avant d’être enregistré.':'Les fichiers se téléchargent dans ton dossier de téléchargements.';
  updatePreview();
}
function saveFile(name,type,make){
  var data;
  try{data=make(new Date())}catch(e){toast('Impossible de générer le fichier.');return}
  if(dl){
    dl.save({filename:name,data:data}).then(function(){toast('Fichier enregistré.')},function(e){
      if(e&&e.code==='declined')toast('Téléchargement annulé.');
      else if(e&&e.code==='rate_limited')toast('Un instant, puis réessaie.');
      else toast('Le fichier n’a pas pu être enregistré.');
    });
    return;
  }
  try{
    var blob=new Blob([data],{type:type}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},4000);toast('Fichier téléchargé.');
  }catch(e){toast('Le fichier n’a pas pu être téléchargé.')}
}
function copyText(){
  var t=buildText(new Date());
  function fallback(){var f=$('#fallback'),ta=$('#fallback-ta');f.classList.add('show');ta.value=t;ta.focus();ta.select();toast('Sélectionne le texte puis copie-le.')}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('Version texte copiée.')},fallback)}else fallback();
}

/* ---------- Navigation et validation ---------- */
function validate(i){
  var ok=true,first=null;
  STEPS[i].qs.forEach(function(q){
    var msg='';
    if(q.req){
      if(q.type==='text'&&!String(S[q.id]||'').trim())msg='Cette réponse est nécessaire pour continuer.';
      if(q.type==='multi'&&!(S[q.id]||[]).length)msg='Choisis au moins une option.';
    }
    var e=$('[data-err="'+q.id+'"]');if(e)e.textContent=msg;
    if(msg){ok=false;if(!first)first=q.id}
  });
  if(first){var el=$('[data-q="'+first+'"]');if(el)el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'})}
  return ok;
}
function go(i,free){
  if(!free&&stepIdx>=0&&stepIdx<NSTEPS&&i>stepIdx&&!validate(stepIdx))return;
  stepIdx=i;
  if(i>=0&&i<NSTEPS)visited=Math.max(visited,i);
  if(i===NSTEPS)visited=NSTEPS-1;
  save();
  if(i===-1)renderIntro();else if(i===NSTEPS)renderResult();else renderStep(i);
  var t=$('#top');if(t)t.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
  if(STEPS[i]&&STEPS[i].k==='mouvement')setTimeout(playPreview,200);
}

/* ---------- Événements ---------- */
var main=$('#main');
main.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.k){S[t.dataset.k]=t.value;if(t.dataset.k==='compte')updatePreview();save();var er=$('[data-err="'+t.dataset.k+'"]');if(er&&t.value.trim())er.textContent='';var qe=t.closest('.q');if(qe)qe.classList.toggle('ok',!!t.value.trim())}
  else if(t.dataset.scale){S[t.dataset.scale]=+t.value;sync();save();if(t.dataset.scale==='energie')debouncePlay()}
  else if(t.dataset.pal){S.palette[t.dataset.pal]=t.value;S.palette.preset='Perso';paletteTouched=true;sync();save()}
});
main.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.k==='logiciel'){S.logiciel=t.value;save()}});
var playT;function debouncePlay(){clearTimeout(playT);playT=setTimeout(playPreview,250)}
main.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.multi){
    var id=b.dataset.multi,max=+b.dataset.max,a=S[id]||[],v=b.dataset.v,ix=a.indexOf(v);
    if(ix>-1)a.splice(ix,1);else{a.push(v);if(max&&a.length>max)a.shift()}
    S[id]=a;var er=$('[data-err="'+id+'"]');if(er)er.textContent='';
  }
  else if(b.dataset.single){var sid=b.dataset.single;S[sid]=(S[sid]===b.dataset.v)?'':b.dataset.v;if(sid==='mouvement'||sid==='rythme')debouncePlay()}
  else if(b.dataset.font){S[b.dataset.font]=b.dataset.v}
  else if(b.dataset.cad){S.cadence=(String(S.cadence)===b.dataset.cad)?0:+b.dataset.cad}
  else if(b.dataset.preset){
    var pr=PRESETS.filter(function(p){return p.n===b.dataset.preset})[0],np={preset:pr.n};
    PAL_ROLES.forEach(function(r,i){np[r[0]]=pr.c[i]});
    S.palette=np;paletteTouched=true;
  }
  else return;
  sync();save();
});
$('#pv-replay').onclick=playPreview;
$('#pv-safe').onchange=function(e){$('#pv').classList.toggle('showsafe',e.target.checked)};
var mq=window.matchMedia('(min-width: 900px)');
function pvLayout(){var d=$('#pvwrap');if(mq.matches)d.open=true}
pvLayout();if(mq.addEventListener)mq.addEventListener('change',pvLayout);

/* Téléchargement : capacité de la plateforme si elle existe, sinon téléchargement du navigateur */
(async function(){
  try{dl=(await (window.claude&&window.claude.use?window.claude.use('downloads'):null))||null}catch(e){dl=null}
  var nt=$('#dl-note');if(nt)nt.textContent=dl?'Chaque fichier te demande une confirmation avant d’être enregistré.':'Les fichiers se téléchargent dans ton dossier de téléchargements.';
})();

renderIntro();
})();
</script>
